# BACnet/IP Subnet Listener & IMOPS Gateway Configuration
# Configured for Production Optergy P864 (Device 864077 @ 192.168.0.160) per 'Optergy BACnet Points.xlsx'.
# Copy this file to config.yaml (or override any setting via environment variables).

gateway_id: "zaarr-bacnet-gw-01"
site_name: "Smart Nation Exhibition System"
log_level: "info" # debug | info | warn | error

status_api:
  enabled: true
  listen_addr: "127.0.0.1:8090" # Set to "0.0.0.0:8090" on Ubuntu server to access the Web Dashboard over LAN

network:
  subnet: ""              # Optional target subnet: e.g. "192.168.0.0/24", "192.168.0", or NIC name ("Ethernet 2")
  interface: ""           # Leave empty to auto-detect all IPv4 subnets (or use network.subnet above)
  bind_ip: "0.0.0.0"      # Bind to all interfaces so subnet broadcasts (192.168.0.255:47808) are received
  port: 47808             # Standard BACnet/IP UDP port (0xBAC0)
  reuse_port: true        # Enables SO_REUSEADDR so listener can coexist on machines running Optergy Studio
  broadcast_overrides: [] # Optional explicit targets, e.g. ["192.168.0.255:47808", "192.168.0.160:47808"]
  bbmd_address: ""        # Optional BBMD "ip:47808" if gateway is placed on a separate routed VLAN
  bbmd_ttl_seconds: 120
  request_timeout_ms: 3000
  max_retries: 2
  include_raw_hex: false

polling:
  discovery_interval_sec: 60  # Active Who-Is broadcast interval
  metadata_refresh_sec: 600   # Metadata refresh interval
  poll_interval_sec: 5        # Present_Value & Status_Flags polling interval (5s for rapid alarm detection)
  rpm_batch_size: 8           # Max objects per ReadPropertyMultiple request
  subscribe_cov: true         # Subscribe to real-time Unconfirmed-COV notifications on P864 inputs
  cov_lifetime_sec: 300
  only_catalog_points: true   # true = strictly monitor the 12 production points in 'Optergy BACnet Points.xlsx'
  extra_object_ids: []        # Optional extra BACnet objects to monitor alongside catalog, e.g. ["BI-8", "AI-301"]
  forward_packet_events: false
  allowed_device_ids: []      # Empty = allow discovered P864 (or set [864077] to lock strictly to Device 864077)

imops:
  enabled: false          # false = disable IMOPS (BACnet + Dashboard only); set true to push to IMOPS API
  base_url: ""            # Set your external IMOPS API base URL, e.g. "https://api.imops.example.com"
  telemetry_path: "/api/v1/bacnet/telemetry"
  devices_path: "/api/v1/bacnet/devices"
  packet_events_path: "/api/v1/bacnet/packets"
  auth_type: "basic"      # basic (username + password) | login (POST username/password -> token) | bearer | api_key | none
  username: ""            # IMOPS username
  password: ""            # IMOPS password
  login_path: "/api/v1/auth/login" # Only used if auth_type: "login"
  api_key_header: "X-API-Key"
  api_key: ""
  bearer_token: ""
  extra_headers: {}
  batch_max_points: 100
  flush_interval_ms: 1500
  http_timeout_ms: 10000
  max_retries: 3
  retry_base_backoff_ms: 500
  dry_run_log_payloads: true # Logs JSON payloads locally if enabled: true and base_url is empty
