# ==============================================================================
# BACnet/IP Subnet Listener & IMOPS Gateway — Single-File Configuration
# Copy this file to config.yaml (no .env file required).
# ==============================================================================

gateway_id: "zaarr-bacnet-gw-01"
site_name: "Smart Nation Exhibition System"
log_level: "info" # debug | info | warn | error

status_api:
  enabled: true
  listen_addr: "127.0.0.1:8090" # Set to "0.0.0.0:8090" to access the Web Dashboard over LAN

network:
  subnet: ""                  # Optional target subnet: e.g. "Ethernet", "192.168.0.0/24", or "192.168.0"
  interface: ""               # Leave empty to auto-detect all IPv4 subnets (or set e.g. "Ethernet")
  bind_ip: "0.0.0.0"          # Set to specific NIC IP (e.g. "192.168.0.197") if Wi-Fi shares the same subnet
  port: 47808                 # Standard BACnet/IP UDP port (0xBAC0)
  reuse_port: true            # Enables SO_REUSEADDR so listener can coexist on machines running Optergy Studio
  broadcast_overrides: []     # Optional explicit targets, e.g. ["192.168.0.255:47808", "192.168.0.160:47808"]
  bbmd_address: ""            # Optional BBMD "ip:47808" if gateway is placed on a separate routed VLAN
  bbmd_ttl_seconds: 120
  request_timeout_ms: 3000
  max_retries: 2
  include_raw_hex: false

polling:
  discovery_interval_sec: 60  # Active Who-Is broadcast interval
  metadata_refresh_sec: 600   # Metadata refresh interval
  poll_interval_sec: 5        # Present_Value & Status_Flags polling interval (5s for rapid alarm detection)
  rpm_batch_size: 8           # Max objects per ReadPropertyMultiple request
  subscribe_cov: true         # Subscribe to real-time Unconfirmed-COV notifications
  cov_lifetime_sec: 300
  only_catalog_points: true   # true = strictly monitor the 'points:' list below; false = poll all objects
  extra_object_ids: []        # Optional extra BACnet objects, e.g. ["BI-8", "AI-301"]
  forward_packet_events: false
  allowed_device_ids: []      # Empty = allow controllers in 'points:' (or e.g. [864077, 300])

imops:
  enabled: false              # false = disable outbound push; set true to push to CDE Kong / IMOPS API
  base_url: ""                # e.g. "http://<CDE_SERVER_IP>:8088" or "https://<CDE_SERVER_IP>:8443"
  telemetry_path: "/api/v1/bacnet/telemetry"
  devices_path: "/api/v1/bacnet/devices"
  packet_events_path: "/api/v1/bacnet/packets"
  auth_type: "api_key"        # api_key | bearer | basic | login | none
  username: ""                # Username (for basic / login)
  password: ""                # Password (for basic / login)
  login_path: "/api/v1/auth/login" # Only used if auth_type: "login"
  api_key_header: "X-API-Key"
  api_key: ""                 # e.g. "zaarr-bacnet-gw01-key-2026"
  bearer_token: ""
  extra_headers: {}
  batch_max_points: 100
  flush_interval_ms: 1500
  http_timeout_ms: 10000
  verify_tls: false           # false = allow self-signed TLS cert (e.g. Kong :8443)
  max_retries: 3
  retry_base_backoff_ms: 500
  dry_run_log_payloads: true  # Logs JSON payloads locally if enabled: true and base_url is empty

