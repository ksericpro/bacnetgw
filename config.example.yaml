# BACnet/IP Subnet Listener & IMOPS Gateway Configuration
# Copy this file to config.yaml (or override any setting via environment variables).

gateway_id: "zaarr-bacnet-gw-01"
site_name: "Optergy Exhibition System"
log_level: "info" # debug | info | warn | error

status_api:
  enabled: true
  listen_addr: "127.0.0.1:8090" # Exposes /healthz, /status, and POST /discover

network:
  interface: ""           # Leave empty to auto-detect all active IPv4 subnets, or set NIC name e.g. "Ethernet" / "eth0"
  bind_ip: "0.0.0.0"      # Bind to all interfaces so subnet broadcasts (e.g. 192.168.1.255:47808) are received
  port: 47808             # Standard BACnet/IP UDP port (0xBAC0)
  reuse_port: true        # Enables SO_REUSEADDR so listener can coexist on machines running Optergy Studio
  broadcast_overrides: [] # Optional explicit broadcast IPs, e.g. ["192.168.1.255:47808"]
  bbmd_address: ""        # Optional BBMD "ip:47808" if gateway is ever placed on a separate routed VLAN
  bbmd_ttl_seconds: 120
  request_timeout_ms: 3000
  max_retries: 2
  include_raw_hex: false  # Set true to include hex payload on decoded BACnet packet events

polling:
  discovery_interval_sec: 60  # Active Who-Is broadcast interval to auto-detect new controllers
  metadata_refresh_sec: 600   # Re-scan Object_List interval
  poll_interval_sec: 15       # Present_Value & Status_Flags polling interval
  rpm_batch_size: 8           # Max objects per ReadPropertyMultiple request
  subscribe_cov: true         # Subscribe to real-time Unconfirmed-COV notifications (leak, occupancy, IAQ)
  cov_lifetime_sec: 300
  forward_packet_events: false # Set true to also stream decoded wire packet metadata to imops.packet_events_path
  allowed_device_ids: []       # Empty = integrate all discovered BACnet devices on the subnet

imops:
  enabled: true
  base_url: "" # Set your external IMOPS API base URL, e.g. "https://api.imops.example.com"
  telemetry_path: "/api/v1/bacnet/telemetry"
  devices_path: "/api/v1/bacnet/devices"
  packet_events_path: "/api/v1/bacnet/packets"
  auth_type: "api_key" # none | api_key | bearer | basic
  api_key_header: "X-API-Key"
  api_key: ""
  bearer_token: ""
  basic_username: ""
  basic_password: ""
  extra_headers: {}
  batch_max_points: 100
  flush_interval_ms: 2000
  http_timeout_ms: 10000
  max_retries: 3
  retry_base_backoff_ms: 500
  dry_run_log_payloads: true # Logs JSON payloads locally while base_url is empty

