# ==============================================================================
# Local Simulation Configuration (127.0.0.1 Loopback with mock-exhibition.exe)
# Usage: .\bacnet-gw.exe -config config.sim.yaml   (or run .\start-sim.bat)
# ==============================================================================

gateway_id: "zaarr-bacnet-gw-01"
site_name: "Smart Nation Exhibition System"
log_level: "info"

status_api:
  enabled: true
  listen_addr: "127.0.0.1:8090"

network:
  subnet: ""
  interface: ""
  bind_ip: "127.0.0.1"
  port: 47809                             # Local gateway UDP port (mock-exhibition sends COV here)
  reuse_port: true
  broadcast_overrides:
    - "127.0.0.1:47810"                   # Simulated Optergy P864 (#864077) UDP port
  request_timeout_ms: 2000
  max_retries: 1

polling:
  discovery_interval_sec: 30
  metadata_refresh_sec: 600
  poll_interval_sec: 3
  rpm_batch_size: 8
  subscribe_cov: true
  cov_lifetime_sec: 300
  only_catalog_points: true

imops:
  enabled: true                           # Pushes simulated 12-sensor telemetry to CDE Kong API Gateway
  base_url: "http://127.0.0.1:8088"       # Local Kong (or use "https://isems-office-cde.somesolutions.xyz" for prod CDE)
  telemetry_path: "/api/v1/bacnet/telemetry"
  devices_path: "/api/v1/bacnet/devices"
  auth_type: "api_key"
  api_key_header: "X-API-Key"
  api_key: "zaarr-bacnet-gw01-key-2026"
  http_timeout_ms: 10000
  verify_tls: true
  batch_max_points: 100
  flush_interval_ms: 500

points:
  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "AI-101"
    sensor_name: "BW-INT-M (WIRELESS AIR TOUCH DISPLAY)"
    dashboard_label: "BW-INT-M"
    property_label: "Temperature"
    physical_input: "BG-1000-M (Wireless)"
    unit: "°C"

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "AI-102"
    sensor_name: "BW-INT-M (WIRELESS AIR TOUCH DISPLAY)"
    dashboard_label: "BW-INT-M"
    property_label: "Humidity"
    physical_input: "BG-1000-M (Wireless)"
    unit: "%RH"

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "AV-27126"
    sensor_name: "BW-INT-M (WIRELESS AIR TOUCH DISPLAY)"
    dashboard_label: "BW-INT-M"
    property_label: "Temperature Setpoint"
    physical_input: "BG-1000-M (Wireless)"
    unit: "°C"

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "AI-201"
    sensor_name: "BW-TH-M (WIRELESS TEMPERATURE & HUMIDITY SENSOR)"
    dashboard_label: "BW-TH-M"
    property_label: "Temperature"
    physical_input: "BG-1000-M (Wireless)"
    unit: "°C"

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "AI-202"
    sensor_name: "BW-TH-M (WIRELESS TEMPERATURE & HUMIDITY SENSOR)"
    dashboard_label: "BW-TH-M"
    property_label: "Humidity"
    physical_input: "BG-1000-M (Wireless)"
    unit: "%RH"

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "BI-1"
    sensor_name: "WD3 (WATER LEAK)"
    dashboard_label: "WD3"
    property_label: "Water detected"
    physical_input: "IN 1 • Dry Contact (LED 1)"
    inactive_text: "Normal"
    active_text: "Water Detected"
    alarm_on_active: true
    trigger_on_active: true

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "BI-2"
    sensor_name: "MSA237D 99 (MOTION SENSOR)"
    dashboard_label: "MSA237D 99"
    property_label: "Motion / presence detected"
    physical_input: "IN 2 • Dry Contact (LED 2)"
    inactive_text: "Clear"
    active_text: "Motion Detected"
    alarm_on_active: false
    trigger_on_active: true

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "BI-3"
    sensor_name: "FIRE SENSOR"
    dashboard_label: "Fire Detection Sensor"
    property_label: "Fire alarm contact activated"
    physical_input: "IN 3 • Dry Contact (LED 3)"
    inactive_text: "Normal"
    active_text: "Fire Alarm"
    alarm_on_active: true
    trigger_on_active: true

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "BI-4"
    sensor_name: "PERIMETER INTRUSION (MAXIBUS)"
    dashboard_label: "PERIMETER INTRUSION (MAXIBUS)"
    property_label: "Intrusion Detector"
    physical_input: "IN 4 • Dry Contact (LED 4)"
    inactive_text: "Secure"
    active_text: "Intrusion Detected"
    alarm_on_active: true
    trigger_on_active: true

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "BI-5"
    sensor_name: "UPS MONITORING (DRY Contact)"
    dashboard_label: "UPS MONITORING"
    property_label: "UPS on battery / power failure"
    physical_input: "IN 5 • Dry Contact (LED 5)"
    inactive_text: "Mains OK"
    active_text: "UPS On Battery / Failure"
    alarm_on_active: true
    trigger_on_active: true

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "BI-6"
    sensor_name: "Access Control System (DRY Contact)"
    dashboard_label: "Access Control System"
    property_label: "Unauthorized access / door forced open"
    physical_input: "IN 6 • Dry Contact (LED 6)"
    inactive_text: "Secure"
    active_text: "Door Forced Open"
    alarm_on_active: true
    trigger_on_active: true

  - device_id: 864077
    controller_ip: "127.0.0.1"
    object: "BI-7"
    sensor_name: "Server Rack Door Contact (DRY Contact)"
    dashboard_label: "Server Rack Door Contact"
    property_label: "Rack door opened without authorization"
    physical_input: "IN 7 • Dry Contact (LED 7)"
    inactive_text: "Closed"
    active_text: "Rack Door Opened"
    alarm_on_active: true
    trigger_on_active: true

